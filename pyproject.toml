[project]
name = "quantified-self"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["chdb>=4.0.1", "pyarrow>=15.0.0", "polars>=1.0.0"]

[project.scripts]
bdp = "bdp.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bdp"
module-root = ""

[dependency-groups]
dev = [
    "jinja2>=3.1.6",
    "pytest>=9.0.2",
    "regex>=2024.0.0",
    "ruff>=0.15.0",
    "sqruff>=0.34.1",
    "ty>=0.0.15",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle (error)
    "W",      # pycodestyle (warning)
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "I",      # isort
    "UP",     # pyupgrade
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "PYI",    # flake8-pyi
    "RUF",    # ruff
    "RUF067", # non-empty-init-module
]

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: "observable/package.json"
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "observable/package.json"
          cache-dependency-path: "observable/pnpm-lock.yaml"
          cache: "pnpm"

      - name: Install Python dependencies
        run: uv sync

      - name: Install Node.js dependencies
        run: pnpm -C observable install

      - name: Generate mock data
        run: make mock

      - name: Materialize assets
        run: make run

      - name: Build Observable site
        run: pnpm -C observable build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: observable/dist

  deploy-production:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
